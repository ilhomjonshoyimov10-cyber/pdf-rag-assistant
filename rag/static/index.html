<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF RAG Assistant</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --line: #e3e0d8; --text: #1d1d1b; --muted: #6b6a64;
    --accent: #1f5f4a; --accent-soft: #e4efe9; --cite: #b4541a;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 20px; background: var(--panel); }
  aside h1 { font-size: 17px; margin: 0 0 4px; }
  aside .status { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  ul.docs { list-style: none; padding: 0; margin: 16px 0 0; }
  ul.docs li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  ul.docs small { color: var(--muted); display: block; }
  ul.docs button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  main { padding: 32px; max-width: 900px; width: 100%; }
  form { display: flex; gap: 10px; }
  input[type=text] { flex: 1; padding: 12px 14px; font: inherit; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button.ask { background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 0 20px; font-weight: 600; cursor: pointer; }
  button.ask:disabled { opacity: .5; }
  .hints { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .hints button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .hints button:hover { color: var(--accent); border-color: var(--accent); }
  .answer { margin-top: 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; line-height: 1.6; white-space: pre-wrap; }
  .answer .mode { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; white-space: normal; }
  .cite { color: var(--cite); font-weight: 600; cursor: pointer; }
  .sources { margin-top: 18px; display: grid; gap: 10px; }
  .source { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .source.cited { border-left: 3px solid var(--cite); }
  .source.flash { box-shadow: 0 0 0 3px var(--accent-soft); }
  .source header { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .source p { margin: 0; color: #3b3a36; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 20px; } }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>PDF RAG Assistant</h1>
    <div class="status" id="status">…</div>
    <label class="drop" id="drop">
      PDF faylni shu yerga tashlang yoki bosing
      <input type="file" id="file" accept="application/pdf" hidden>
    </label>
    <ul class="docs" id="docs"></ul>
  </aside>
  <main>
    <form id="form">
      <input type="text" id="q" placeholder="Hujjatlar bo'yicha savol bering…" autocomplete="off">
      <button class="ask" id="ask">So'rash</button>
    </form>
    <div class="hints" id="hints">
      <button>Yillik ta'til necha kun?</button>
      <button>Masofadan haftasiga necha kun ishlash mumkin?</button>
      <button>Xorijga safarda sutkalik qancha?</button>
      <button>Parol qanchalik uzun bo'lishi kerak?</button>
      <button>Ish haqi qachon to'lanadi?</button>
    </div>
    <div id="result"></div>
  </main>
</div>
<script>
  const $ = id => document.getElementById(id);

  async function refresh() {
    const [health, docs] = await Promise.all([fetch("/health").then(r => r.json()), fetch("/api/documents").then(r => r.json())]);
    $("status").textContent = `${health.documents} hujjat · ${health.chunks} bo'lak · qidiruv: ${health.retrieval} · javob: ${health.generation}`;
    const list = $("docs");
    list.replaceChildren();
    for (const d of docs) {
      const li = document.createElement("li");
      const info = document.createElement("div");
      info.textContent = d.filename;
      const meta = document.createElement("small");
      meta.textContent = `${d.pages} bet · ${d.chunks} bo'lak`;
      info.appendChild(meta);
      const del = document.createElement("button");
      del.textContent = "×";
      del.title = "O'chirish";
      del.onclick = async () => { await fetch(`/api/documents/${d.id}`, { method: "DELETE" }); refresh(); };
      li.append(info, del);
      list.appendChild(li);
    }
  }

  async function upload(file) {
    $("drop").firstChild.textContent = `Yuklanmoqda: ${file.name}…`;
    const body = new FormData();
    body.append("file", file);
    const res = await fetch("/api/documents", { method: "POST", body });
    const data = await res.json();
    $("drop").firstChild.textContent = res.ok ? `Qo'shildi: ${data.filename}` : `Xato: ${data.detail}`;
    refresh();
  }

  function renderAnswer(data) {
    const box = document.createElement("div");
    box.className = "answer";
    const mode = document.createElement("div");
    mode.className = "mode";
    mode.textContent = { llm: "AI javobi (manbalar asosida)", extractive: "Eng mos parchalar (LLM ulanmagan)", not_found: "Topilmadi" }[data.mode];
    box.appendChild(mode);
    // turn [n] into clickable citations, building DOM nodes (no innerHTML with model output)
    for (const part of data.answer.split(/(\[\d+\])/)) {
      const m = part.match(/^\[(\d+)\]$/);
      if (m) {
        const span = document.createElement("span");
        span.className = "cite";
        span.textContent = part;
        span.onclick = () => { const el = $(`src-${m[1]}`); if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200); } };
        box.appendChild(span);
      } else box.appendChild(document.createTextNode(part));
    }
    const sources = document.createElement("div");
    sources.className = "sources";
    for (const s of data.sources) {
      const card = document.createElement("div");
      card.className = "source" + (s.cited ? " cited" : "");
      card.id = `src-${s.n}`;
      const head = document.createElement("header");
      head.textContent = `[${s.n}] ${s.filename} — ${s.page}-bet`;
      const score = document.createElement("span");
      score.textContent = `score ${s.score}`;
      head.appendChild(score);
      const p = document.createElement("p");
      p.textContent = s.text;
      card.append(head, p);
      sources.appendChild(card);
    }
    $("result").replaceChildren(box, sources);
  }

  async function ask(question) {
    $("q").value = question;
    $("ask").disabled = true;
    $("result").textContent = "Qidirilmoqda…";
    try {
      const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      renderAnswer(data);
    } catch (e) {
      $("result").textContent = "Xato: " + e.message;
    } finally {
      $("ask").disabled = false;
    }
  }

  $("form").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (q) ask(q); };
  $("hints").onclick = e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); };
  $("file").onchange = e => e.target.files[0] && upload(e.target.files[0]);
  const drop = $("drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };
  refresh();
</script>
</body>
</html>

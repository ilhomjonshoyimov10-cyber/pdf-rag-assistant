[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-rag-assistant"
version = "1.0.0"
description = "Ask questions about PDF documents and get answers with page-level citations (hybrid BM25 + vector retrieval)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ilhomjon Shoyimov" }]
dependencies = [
    "pypdf>=4.0",
    "numpy>=1.26",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.setuptools.package-data]
rag = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001"]
"rag/text.py" = ["RUF001", "RUF002", "SIM905"]  # Cyrillic stop words are intentional
